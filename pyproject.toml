[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-harness"
version = "0.1.0"
description = "A resumable benchmark harness optimized for NVIDIA Nemotron Nano 9B."
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
benchmarks = [
  "datasets>=3.0",
]
test = []

[project.scripts]
nano-harness = "nano_harness.cli:main"

[tool.setuptools.packages.find]
include = ["nano_harness*"]
